# HONS 进销存管理系统 - Nginx 配置
# 适用于宝塔面板或标准 Nginx 环境
# 
# 安装方式：
# 1. 宝塔面板：网站 → 站点设置 → 配置文件 → 粘贴以下内容到 server 块内
# 2. 标准 Nginx：将此文件复制到 /etc/nginx/sites-available/ 并软链接到 sites-enabled/

server {
    listen 80;
    server_name your-domain.com;  # 修改为实际域名
    
    # 访问日志
    access_log /www/wwwroot/your-domain.com/logs/nginx_access.log;
    error_log /www/wwwroot/your-domain.com/logs/nginx_error.log;
    
    # 客户端上传限制（根据实际需求调整）
    client_max_body_size 50M;
    
    # 静态文件直接由 Nginx 处理
    location /static/ {
        alias /www/wwwroot/your-domain.com/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # 上传文件目录
    location /uploads/ {
        alias /www/wwwroot/your-domain.com/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # 备份文件下载（需认证，由应用处理）
    location /backups/ {
        internal;
        alias /www/wwwroot/your-domain.com/backups/;
    }
    
    # 反向代理到 Gunicorn
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # 安全头部
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # 禁止访问敏感文件
    location ~ /\. {
        deny all;
    }
    
    location ~* \.(db|sqlite|sqlite3|log|key|pem)$ {
        deny all;
    }
    
    location ~* ^/(venv|node_modules|\.git)/ {
        deny all;
    }
}

