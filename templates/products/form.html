{% extends "base.html" %}

{% block title %}{{ '编辑商品' if product else '新增商品' }} - 进销存管理系统{% endblock %}

{% block content %}
<div class="d-flex justify-content-end align-items-center mb-4">
    <a href="{{ url_for('products.list') }}" class="btn btn-secondary">
        <i class="fas fa-arrow-left me-1"></i>返回列表
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post" class="needs-validation" novalidate>
            <div class="row">
                <!-- 基本信息 -->
                <div class="col-6 col-md-12">
                    <div class="form-group">
                        <label for="sku" class="form-label">商品编码 <span style="color: var(--danger);">*</span></label>
                        <input type="text" class="form-control" id="sku" name="sku"
                               value="{{ product.sku if product else '' }}" required placeholder="请输入商品编码">
                        <div class="invalid-feedback">请输入商品编码</div>
                    </div>
                </div>
                <div class="col-6 col-md-12">
                    <div class="form-group">
                        <label for="name" class="form-label">商品名称 <span style="color: var(--danger);">*</span></label>
                        <input type="text" class="form-control" id="name" name="name"
                               value="{{ product.name if product else '' }}" required placeholder="请输入商品名称">
                        <div class="invalid-feedback">请输入商品名称</div>
                    </div>
                </div>
                
                <!-- 条形码 -->
                <div class="col-6 col-md-12">
                    <div class="form-group">
                        <label for="barcode" class="form-label">
                            <i class="fas fa-barcode me-1"></i>条形码（防串货）
                        </label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="barcode" name="barcode"
                                   value="{{ product.barcode if product else '' }}" placeholder="扫描或输入条形码">
                            <button type="button" class="btn btn-secondary" id="scanBtn" title="打开扫描">
                                <i class="fas fa-camera"></i>
                            </button>
                        </div>
                        <div class="form-text">可使用扫描枪或点击相机图标扫描</div>
                    </div>
                </div>
                
                <!-- 剂型 -->
                <div class="col-6 col-md-12">
                    <div class="form-group">
                        <label for="dosage_form" class="form-label">剂型</label>
                        <input type="text" class="form-control" id="dosage_form" name="dosage_form"
                               value="{{ product.dosage_form if product else '' }}" placeholder="如：胶囊、片剂、颗粒">
                    </div>
                </div>
                
                <!-- 生产厂家 -->
                <div class="col-6 col-md-12">
                    <div class="form-group">
                        <label for="manufacturer" class="form-label">生产厂家</label>
                        <input type="text" class="form-control" id="manufacturer" name="manufacturer"
                               value="{{ product.manufacturer if product else '' }}" placeholder="请输入生产厂家">
                    </div>
                </div>
                
                <!-- 批准文号 -->
                <div class="col-6 col-md-12">
                    <div class="form-group">
                        <label for="approval_no" class="form-label">批准文号</label>
                        <input type="text" class="form-control" id="approval_no" name="approval_no"
                               value="{{ product.approval_no if product else '' }}" placeholder="如：国药准字H12345678">
                    </div>
                </div>
                
                <!-- 规格 -->
                <div class="col-6 col-md-12">
                    <div class="form-group">
                        <label for="specification" class="form-label">商品规格</label>
                        <input type="text" class="form-control" id="specification" name="specification"
                               value="{{ product.specification if product else '' }}" placeholder="如：500ml/瓶、10片/盒">
                    </div>
                </div>
                
                <div class="col-6 col-md-12">
                    <div class="form-group">
                        <label for="category" class="form-label">商品分类</label>
                        <input type="text" class="form-control" id="category" name="category"
                               value="{{ product.category if product else '' }}" placeholder="请输入商品分类">
                    </div>
                </div>
                <div class="col-6 col-md-12">
                    <div class="form-group">
                        <label for="unit" class="form-label">计量单位</label>
                        <input type="text" class="form-control" id="unit" name="unit"
                               value="{{ product.unit if product else '个' }}" placeholder="如：个、件、箱">
                    </div>
                </div>
                
                <div class="col-6 col-md-12">
                    <div class="form-group">
                        <label for="cost_price" class="form-label">成本价</label>
                        <input type="number" step="0.01" min="0" class="form-control" id="cost_price" name="cost_price"
                               value="{{ product.cost_price if product else '0' }}">
                    </div>
                </div>
                <div class="col-6 col-md-12">
                    <div class="form-group">
                        <label for="selling_price" class="form-label">售价</label>
                        <input type="number" step="0.01" min="0" class="form-control" id="selling_price" name="selling_price"
                               value="{{ product.selling_price if product else '0' }}">
                    </div>
                </div>
                <div class="col-6 col-md-12">
                    <div class="form-group">
                        <label for="min_stock" class="form-label">最低库存预警值</label>
                        <input type="number" min="0" class="form-control" id="min_stock" name="min_stock"
                               value="{{ product.min_stock if product else '0' }}" placeholder="低于此值将触发预警">
                    </div>
                </div>
                
                <!-- 状态 -->
                <div class="col-6 col-md-12">
                    <div class="form-group">
                        <label class="form-label">商品状态</label>
                        <div style="display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-2);">
                            <label style="display: flex; align-items: center; gap: var(--space-2); cursor: pointer;">
                                <input type="checkbox" id="is_active" name="is_active"
                                       value="1" {% if not product or product.is_active %}checked{% endif %}
                                       style="width: 18px; height: 18px; cursor: pointer;">
                                <span id="statusText">{% if not product or product.is_active %}启用{% else %}停用{% endif %}</span>
                            </label>
                        </div>
                        <div class="form-text" id="statusWarning" style="display:none; color: var(--warning);">
                            <i class="fas fa-exclamation-triangle me-1"></i>停用后该商品将无法进行出入库操作
                        </div>
                    </div>
                </div>
                
                <div class="col-12">
                    <div class="form-group">
                        <label for="description" class="form-label">商品描述</label>
                        <textarea class="form-control" id="description" name="description" rows="3"
                                  placeholder="请输入商品描述">{{ product.description if product else '' }}</textarea>
                    </div>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i>保存
                </button>
                <a href="{{ url_for('products.list') }}" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>
</div>

<!-- 扫描模态框 -->
<div class="modal fade" id="scannerModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-barcode me-2"></i>扫描条形码</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <div id="scannerContainer" style="position:relative; width:100%; max-width:640px; margin:0 auto;">
                    <video id="scannerVideo" style="width:100%; border-radius:8px;" autoplay playsinline></video>
                    <canvas id="scannerCanvas" style="display:none;"></canvas>
                    <div id="scannerOverlay" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); 
                                                    width:80%; height:100px; border:2px dashed var(--primary); border-radius:8px;
                                                    background:rgba(37,99,235,0.1);
                                                    display:flex; align-items:center; justify-content:center;
                                                    color:var(--primary); font-weight:bold;">
                        将条形码放入框内
                    </div>
                </div>
                <div id="scannerStatus" class="mt-3 text-muted">正在启动相机...</div>
                <div class="mt-3">
                    <button type="button" class="btn btn-secondary" id="switchCameraBtn">
                        <i class="fas fa-sync me-1"></i>切换摄像头
                    </button>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="manualInputBtn">手动输入</button>
            </div>
        </div>
    </div>
</div>

<!-- 手动输入条形码模态框 -->
<div class="modal fade" id="manualBarcodeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">输入条形码</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="text" class="form-control" id="manualBarcodeInput" placeholder="请输入条形码">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="confirmBarcodeBtn">确认</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/scanner.js') }}"></script>
<script>
// 表单验证
(function() {
    'use strict';
    var forms = document.querySelectorAll('.needs-validation');
    Array.prototype.slice.call(forms).forEach(function(form) {
        form.addEventListener('submit', function(event) {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add('was-validated');
        }, false);
    });
})();

// 状态切换显示
var isActiveSwitch = document.getElementById('is_active');
var statusText = document.getElementById('statusText');
var statusWarning = document.getElementById('statusWarning');

isActiveSwitch.addEventListener('change', function() {
    if (this.checked) {
        statusText.textContent = '启用';
        statusWarning.style.display = 'none';
    } else {
        statusText.textContent = '停用';
        statusWarning.style.display = 'block';
    }
});

// 初始状态检查
if (!isActiveSwitch.checked) {
    statusWarning.style.display = 'block';
}

// 扫描功能
var scannerModal = new bootstrap.Modal(document.getElementById('scannerModal'));
var manualBarcodeModal = new bootstrap.Modal(document.getElementById('manualBarcodeModal'));
var barcodeInput = document.getElementById('barcode');

// 打开扫描器
document.getElementById('scanBtn').addEventListener('click', function() {
    scannerModal.show();
    initScanner(function(result) {
        barcodeInput.value = result;
        scannerModal.hide();
    });
});

// 手动输入
document.getElementById('manualInputBtn').addEventListener('click', function() {
    scannerModal.hide();
    manualBarcodeModal.show();
    setTimeout(function() {
        document.getElementById('manualBarcodeInput').focus();
    }, 200);
});

// 确认手动输入
document.getElementById('confirmBarcodeBtn').addEventListener('click', function() {
    var value = document.getElementById('manualBarcodeInput').value.trim();
    if (value) {
        barcodeInput.value = value;
        manualBarcodeModal.hide();
    }
});

// 模态框关闭时停止扫描
document.getElementById('scannerModal').addEventListener('hidden.bs.modal', function() {
    stopScanner();
});
</script>
{% endblock %}
