{% extends 'base.html' %}

{% block title %}创建表单配置 - 进销存管理系统{% endblock %}

{% block page_title %}创建表单配置{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h5 class="card-title">创建表单配置</h5>
        <a href="{{ url_for('form_config.index') }}" class="btn btn-secondary btn-sm">
            <i class="fas fa-arrow-left"></i> 返回列表
        </a>
    </div>
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label for="form_code">表单代码 <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="form_code" name="form_code" required placeholder="如：stock_in_form">
                <small class="form-text text-muted">表单代码用于系统识别，需唯一且不能修改</small>
            </div>
            
            <div class="form-group">
                <label for="form_name">表单名称 <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="form_name" name="form_name" required placeholder="如：入库单">
            </div>
            
            <div class="form-group">
                <label for="description">描述</label>
                <textarea class="form-control" id="description" name="description" rows="3" placeholder="表单描述信息"></textarea>
            </div>
            
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> 创建表单
            </button>
        </form>
    </div>
</div>
{% endblock %}
