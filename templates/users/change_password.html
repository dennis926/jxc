{% extends "base.html" %}

{% block title %}修改密码 - 进销存管理系统{% endblock %}

{% block content %}
<div class="d-flex justify-content-end align-items-center mb-4">
    <a href="{{ url_for('users.profile') }}" class="btn btn-outline-secondary">
        <i class="fas fa-arrow-left me-1"></i>返回个人资料
    </a>
</div>

<div class="card shadow">
    <div class="card-header">
        <h6 class="mb-0"><i class="fas fa-lock me-2"></i>密码修改</h6>
    </div>
    <div class="card-body">
        <!-- 密码强度要求提示 -->
        <div class="alert alert-info mb-3">
            <i class="fas fa-info-circle me-2"></i><strong>密码强度要求：</strong>
            <ul class="mb-0 mt-1">
                <li>至少 8 个字符</li>
                <li>包含大写字母 (A-Z)</li>
                <li>包含小写字母 (a-z)</li>
                <li>包含数字 (0-9)</li>
                <li>包含特殊字符 (!@#$%^&* 等)</li>
            </ul>
        </div>
        <form method="post" class="needs-validation" novalidate>
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="old_password" class="form-label">原密码 <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="old_password" name="old_password"
                           required placeholder="请输入原密码" autocomplete="current-password">
                    <div class="invalid-feedback">请输入原密码</div>
                </div>
                <div class="col-md-6"></div>
                <div class="col-md-6">
                    <label for="new_password" class="form-label">新密码 <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="new_password" name="new_password"
                           required placeholder="请输入新密码" autocomplete="new-password">
                    <div class="invalid-feedback">请输入新密码</div>
                    <!-- 密码强度指示器 -->
                    <div class="mt-2">
                        <div class="progress" style="height: 8px;">
                            <div class="progress-bar" id="password-strength-bar" role="progressbar" style="width: 0%"></div>
                        </div>
                        <small id="password-strength-text" class="text-muted"></small>
                    </div>
                </div>
                <div class="col-md-6">
                    <label for="confirm_password" class="form-label">确认新密码 <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                           required placeholder="请再次输入新密码" autocomplete="new-password">
                    <div class="invalid-feedback">请再次输入新密码</div>
                    <div id="password-match-feedback" class="mt-1"></div>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary" id="submit-btn">
                    <i class="fas fa-save me-1"></i>确认修改
                </button>
                <a href="{{ url_for('users.profile') }}" class="btn btn-outline-secondary">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// 密码强度检测
function checkPasswordStrength(password) {
    let score = 0;
    let feedback = [];
    
    if (password.length >= 8) score += 20;
    else feedback.push('至少8位');
    
    if (/[A-Z]/.test(password)) score += 20;
    else feedback.push('需大写字母');
    
    if (/[a-z]/.test(password)) score += 20;
    else feedback.push('需小写字母');
    
    if (/\d/.test(password)) score += 20;
    else feedback.push('需数字');
    
    if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) score += 20;
    else feedback.push('需特殊字符');
    
    return { score, feedback };
}

// 实时密码强度检测
document.getElementById('new_password').addEventListener('input', function() {
    const password = this.value;
    const result = checkPasswordStrength(password);
    const bar = document.getElementById('password-strength-bar');
    const text = document.getElementById('password-strength-text');
    
    bar.style.width = result.score + '%';
    
    if (result.score === 0) {
        bar.className = 'progress-bar';
        text.textContent = '';
    } else if (result.score < 60) {
        bar.className = 'progress-bar bg-danger';
        text.textContent = '密码强度：弱 - ' + result.feedback.join(', ');
    } else if (result.score < 100) {
        bar.className = 'progress-bar bg-warning';
        text.textContent = '密码强度：中 - ' + result.feedback.join(', ');
    } else {
        bar.className = 'progress-bar bg-success';
        text.textContent = '密码强度：强 ✓';
    }
    
    // 检查密码匹配
    checkPasswordMatch();
});

// 密码匹配检测
function checkPasswordMatch() {
    const newPwd = document.getElementById('new_password').value;
    const confirmPwd = document.getElementById('confirm_password').value;
    const feedback = document.getElementById('password-match-feedback');
    
    if (confirmPwd.length > 0) {
        if (newPwd === confirmPwd) {
            feedback.innerHTML = '<small class="text-success"><i class="fas fa-check me-1"></i>密码匹配</small>';
        } else {
            feedback.innerHTML = '<small class="text-danger"><i class="fas fa-times me-1"></i>密码不匹配</small>';
        }
    } else {
        feedback.innerHTML = '';
    }
}

document.getElementById('confirm_password').addEventListener('input', checkPasswordMatch);

// 表单提交验证
document.querySelector('form').addEventListener('submit', function(e) {
    const password = document.getElementById('new_password').value;
    const result = checkPasswordStrength(password);
    
    if (result.score < 100) {
        e.preventDefault();
        alert('密码强度不足，请确保满足所有要求：\n' + result.feedback.join('\n'));
        return false;
    }
});
</script>
{% endblock %}
