{% extends "base.html" %}

{% block title %}个人资料 - 进销存管理系统{% endblock %}

{% block content %}
<div class="d-flex justify-content-end align-items-center mb-4">
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-secondary">
        <i class="fas fa-arrow-left me-1"></i>返回首页
    </a>
</div>

<div class="card shadow">
    <div class="card-header">
        <h6 class="mb-0"><i class="fas fa-info-circle me-2"></i>基本信息</h6>
    </div>
    <div class="card-body">
        <form method="post" class="needs-validation" novalidate>
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="username" class="form-label">用户名</label>
                    <input type="text" class="form-control" id="username" name="username"
                           value="{{ user.username if user else '' }}" readonly>
                    <small class="text-muted">用户名不可修改</small>
                </div>
                <div class="col-md-6">
                    <label for="role" class="form-label">角色</label>
                    <input type="text" class="form-control" id="role" name="role"
                           value="{{ '管理员' if user and user.role == 'admin' else '普通用户' }}" readonly>
                </div>
                <div class="col-md-6">
                    <label for="real_name" class="form-label">真实姓名</label>
                    <input type="text" class="form-control" id="real_name" name="real_name"
                           value="{{ user.real_name if user else '' }}" placeholder="请输入真实姓名">
                </div>
                <div class="col-md-6">
                    <label for="phone" class="form-label">手机号码</label>
                    <input type="text" class="form-control" id="phone" name="phone"
                           value="{{ user.phone if user else '' }}" placeholder="请输入手机号码">
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label">邮箱地址</label>
                    <input type="email" class="form-control" id="email" name="email"
                           value="{{ user.email if user else '' }}" placeholder="请输入邮箱地址">
                </div>
                <div class="col-md-6">
                    <label class="form-label">创建时间</label>
                    <input type="text" class="form-control"
                           value="{{ user.created_at.strftime('%Y-%m-%d %H:%M:%S') if user.created_at else '-' }}" readonly>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i>保存修改
                </button>
                <a href="{{ url_for('users.change_password') }}" class="btn btn-outline-warning">
                    <i class="fas fa-key me-1"></i>修改密码
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// 表单验证
(function() {
    'use strict';
    var forms = document.querySelectorAll('.needs-validation');
    Array.prototype.slice.call(forms).forEach(function(form) {
        form.addEventListener('submit', function(event) {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add('was-validated');
        }, false);
    });
})();
</script>
{% endblock %}
