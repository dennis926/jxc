{% extends "base.html" %}
{% block title %}404 - 页面不存在{% endblock %}

{% block extra_css %}
<link href="{{ url_for('static', filename='css/error-pages.css') }}?v={{ cache_version }}" rel="stylesheet">
<style>
/* 嵌入 base.html 布局时的容器适配（错误页样式表本身面向独立整页） */
.error-inline-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 65vh;
    padding: 24px;
}
.error-inline-wrap .error-card { margin: 0; }
</style>
{% endblock %}

{% block content %}
<div class="error-inline-wrap">
    <main class="error-card" role="alert">
        <div class="error-head">
            <div class="error-badge is-info" aria-hidden="true">
                <i class="fas fa-magnifying-glass"></i>
            </div>
            <div>
                <span class="error-code">HTTP 404 · NOT FOUND</span>
                <h1 class="error-title">页面不存在</h1>
            </div>
        </div>

        <div class="error-body">
            <p class="error-desc">您访问的页面不存在，可能已被移除、重命名，或者链接地址输入有误。</p>
        </div>

        <div class="error-actions">
            <a href="{{ url_for('dashboard.index') }}" class="err-btn err-btn-primary">
                <i class="fas fa-house" aria-hidden="true"></i>
                返回首页
            </a>
            <a href="#" class="err-btn err-btn-ghost" onclick="history.back(); return false;">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>
                返回上一页
            </a>
        </div>

        <div class="error-foot">
            <i class="fas fa-circle-info" aria-hidden="true"></i>
            <p>可通过左侧导航菜单前往目标模块，或返回首页重新开始。</p>
        </div>
    </main>
</div>
{% endblock %}
