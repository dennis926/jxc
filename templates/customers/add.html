{% extends "base.html" %}

{% block title %}添加客户 - 进销存管理系统{% endblock %}

{% block content %}
<div class="d-flex justify-content-end align-items-center mb-4">
    <a href="{{ url_for('customers.list') }}" class="btn btn-outline-secondary">
        <i class="fas fa-arrow-left me-1"></i>返回列表
    </a>
</div>

<div class="card shadow">
    <div class="card-body">
        <form id="customerForm" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">客户名称 <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">联系人</label>
                    <input type="text" name="contact" class="form-control">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">联系电话</label>
                    <input type="text" name="phone" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">收货地址</label>
                    <input type="text" name="address" class="form-control">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">电子邮箱</label>
                    <input type="email" name="email" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">税号</label>
                    <input type="text" name="tax_no" class="form-control">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">开户行</label>
                    <input type="text" name="bank" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">账号</label>
                    <input type="text" name="account_no" class="form-control">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">备注</label>
                <textarea name="remark" class="form-control" rows="3"></textarea>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i>保存
                </button>
                <a href="{{ url_for('customers.list') }}" class="btn btn-outline-secondary">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
$(document).ready(function() {
    $('#customerForm').on('submit', function(e) {
        e.preventDefault();
        
        $.ajax({
            url: '{{ url_for("customers.add") }}',
            method: 'POST',
            data: $(this).serialize(),
            success: function(res) {
                if (res.success) {
                    alert('添加成功');
                    window.location.href = '{{ url_for("customers.list") }}';
                } else {
                    alert('添加失败：' + res.message);
                }
            },
            error: function() {
                alert('添加失败');
            }
        });
    });
});
</script>
{% endblock %}
